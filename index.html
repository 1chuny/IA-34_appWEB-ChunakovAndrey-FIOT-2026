<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SkyTickets — Find Cheap Flight Tickets</title>
	<link rel="stylesheet" href="css/style.css">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>

<body>
	<header class="header">
		<div class="logo">Sky<span>Tickets</span></div>
		<nav class="nav-links">
			<a href="index.html">Main</a>
			<a href="about.html">About us</a>
			<a href="#" class="placeholder">Directions</a>
			<a href="#" class="placeholder">Special Offers</a>
			<a href="#" class="placeholder">Help</a>
		</nav>

		<div class="auth-group" id="auth-group">
			<button class="btn-login" id="open-login">Log in</button>
			<button class="btn-register" id="open-register">Register</button>
		</div>
	</header>

	<section class="search-section">
		<div class="search-container">
			<div class="search-box">
				<input type="text" id="input-from" placeholder="From?">
				<input type="text" id="input-to" placeholder="To?">
				<input type="date">
				<button class="search-btn" id="btn-search">Find Tickets</button>
			</div>
		</div>
	</section>

	<main class="main">
		<h1 id="main-title">Popular Flights</h1>
		<div id="flights-container" class="ticket-grid"></div>
	</main>

	<div class="modal-overlay" id="modal-login">
		<div class="modal-content">
			<button class="modal-close">&times;</button>
			<h2>Login</h2>
			<form id="form-login">
				<input type="email" id="login-email" placeholder="Email" required>
				<input type="password" id="login-password" placeholder="Password" required>
				<button type="submit" class="buy-btn" style="margin-top: 10px;">Sign In</button>
			</form>
		</div>
	</div>

	<div class="modal-overlay" id="modal-register">
		<div class="modal-content">
			<button class="modal-close">&times;</button>
			<h2>Create Account</h2>
			<form id="form-register">
				<input type="email" id="reg-email" placeholder="Email" required>
				<input type="password" id="reg-password" placeholder="Password (min 6 chars)" minlength="6" required>
				<input type="password" id="reg-confirm" placeholder="Confirm Password" minlength="6" required>
				<button type="submit" class="buy-btn" style="margin-top: 10px;">Sign Up</button>
			</form>
		</div>
	</div>

	<div class="modal-overlay" id="modal-profile">
		<div class="modal-content">
			<button class="modal-close">&times;</button>
			<h2>My Profile</h2>

			<div style="margin-bottom: 20px; padding: 15px; background: #f0f2f5; border-radius: 8px;">
				<p style="margin: 0 0 10px 0;"><strong>Email:</strong> <span id="prof-email">Loading...</span></p>
				<p style="margin: 0;"><strong>Role:</strong> <span id="prof-role">Loading...</span></p>
			</div>

			<h3 style="font-size: 1.1rem; color: #003580; margin-bottom: 10px;">Change Password</h3>
			<form id="form-password" style="margin-bottom: 20px;">
				<input type="password" id="old-password" placeholder="Old Password" required>
				<input type="password" id="new-password" placeholder="New Password" required>
				<button type="submit" class="buy-btn" style="padding: 10px; margin-top: 10px;">Update Password</button>
			</form>

			<button id="btn-delete-account"
				style="width: 100%; padding: 10px; background: #c0392b; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Danger:
				Delete Account</button>
		</div>
	</div>

	<div class="modal-overlay" id="modal-admin">
		<div class="modal-content" style="max-width: 500px;">
			<button class="modal-close">&times;</button>
			<h2>Admin Panel</h2>
	
			<h3 style="color: #003580; margin-top: 10px;">Add New Flight</h3>
			<form id="form-add-flight" style="margin-bottom: 20px; display: grid; gap: 10px; grid-template-columns: 1fr 1fr;">
				<input type="text" id="flight-from" placeholder="From" required style="grid-column: 1;">
				<input type="text" id="flight-to" placeholder="To" required style="grid-column: 2;">
				<input type="time" id="flight-start" required title="Departure">
				<input type="time" id="flight-end" required title="Arrival">
				<input type="text" id="flight-price" placeholder="Price (ex: 450 $)" required style="grid-column: 1;">
				<input type="text" id="flight-img" placeholder="Image URL (e.g. assets/images/new.jpg)" style="grid-column: 2;">
				<button type="submit" class="buy-btn" style="grid-column: 1/-1;">Save Flight</button>
			</form>
	
			<hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
	
			<h3 style="color: #003580;">All Users Purchases</h3>
			<div id="admin-purchases-list"
				style="max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 0.9rem;">
			</div>
		</div>
	</div>

	<footer class="footer">
		<p>&copy; 2026 Air Tickets Online | Project by Andrey Chunakov</p>
	</footer>

	<script src="js/script.js"></script>
</body>

</html>
